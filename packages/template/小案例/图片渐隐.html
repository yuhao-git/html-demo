<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @property --m-0 {
        syntax: "<number>";
        initial-value: 1;
        inherits: false;
      }
      @property --m-1 {
        syntax: "<number>";
        initial-value: 1;
        inherits: false;
      }
      @property --m-2 {
        syntax: "<number>";
        initial-value: 1;
        inherits: false;
      }
      @property --m-3 {
        syntax: "<number>";
        initial-value: 1;
        inherits: false;
      }
      div {
        mask: linear-gradient(90deg, rgba(0, 0, 0, var(--m-0)), rgba(0, 0, 0, var(--m-0))), linear-gradient(90deg, rgba(0, 0, 0, var(--m-1)), rgba(0, 0, 0, var(--m-1))), linear-gradient(90deg, rgba(0, 0, 0, var(--m-2)), rgba(0, 0, 0, var(--m-2))), linear-gradient(90deg, rgba(0, 0, 0, var(--m-3)), rgba(0, 0, 0, var(--m-3)));
        mask-size: 50% 50%;
        mask-repeat: no-repeat;
        mask-position:
          left top,
          right top,
          left bottom,
          bottom right;
        transition:
          --m-0 0.3s,
          --m-1 0.15s 0.1s,
          --m-2 0.25s 0.21s,
          --m-3 0.19s 0.15s;
      }
      div:hover {
        --m-0: 0;
        --m-1: 0;
        --m-2: 0;
        --m-3: 0;
      }
    </style>
  </head>
  <body>
    <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia quibusdam commodi labore exercitationem iusto molestiae, illo voluptatum fugit tempore corrupti deserunt unde illum ratione, adipisci nihil, voluptas laborum eligendi impedit.</div>
  </body>
</html>
